services:
  - type: web
    name: ai-trading-terminal
    runtime: node
    rootDir: ai-trading-terminal
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Uncomment and fill these in (Render dashboard → Environment) to enable
      # live Alpaca trading data. Paper keys recommended.
      # - key: ALPACA_API_KEY_ID
      #   sync: false
      # - key: ALPACA_API_SECRET_KEY
      #   sync: false
      # - key: ALPACA_PAPER
      #   value: "true"
      # Optional: enables Claude-written commentary + OCR statement import.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
